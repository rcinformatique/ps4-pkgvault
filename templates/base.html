<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #f0f2f5;
  --white:     #ffffff;
  --input:     #f5f7fa;
  --hover:     #f8f9ff;
  --accent:    #0067c0;
  --accent-h:  #005ba3;
  --accent-l:  #e8f0fe;
  --accent-b:  #b8d0f5;
  --tp:        #1a1a2e;
  --ts:        #666666;
  --tm:        #aaaaaa;
  --th:        #cccccc;
  --border:    #e4e7ec;
  --border-l:  #eef0f4;
  --border-s:  #dde1e8;
  --success:   #107c10;
  --warning:   #ca5010;
  --error:     #e05a5a;
  --r-sm:      5px;
  --r-md:      8px;
  --r-lg:      12px;
  --r-xl:      16px;
}

html, body {
  font-family: 'Segoe UI', Arial, sans-serif;
  font-size: 14px;
  background: var(--bg);
  color: var(--tp);
  height: 100%;
  overflow: hidden;
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-s); }

.app { display: flex; flex-direction: column; height: 100vh; }

/* TOPBAR */
.topbar {
  background: var(--white);
  height: 52px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 100;
  overflow: hidden;
}

.logo {
  font-size: 15px;
  font-weight: 700;
  color: var(--tp);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}
.logo .accent { color: var(--accent); }

#back-btn {
  display: none;
  background: var(--input);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--ts);
  font-size: 12px;
  padding: 5px 11px;
  cursor: pointer;
  align-items: center;
  gap: 5px;
  font-family: 'Segoe UI', Arial, sans-serif;
  white-space: nowrap;
  transition: all 0.15s;
  flex-shrink: 0;
}
#back-btn:hover { border-color: var(--accent); color: var(--accent); }

.nav-tabs {
  display: flex;
  gap: 1px;
  flex-shrink: 1;
  min-width: 0;
  overflow: hidden;
}

.nav-tab {
  padding: 5px 10px;
  font-size: 12px;
  color: var(--tm);
  border-radius: var(--r-md);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  border: none;
  background: transparent;
  font-family: 'Segoe UI', Arial, sans-serif;
  transition: all 0.15s;
  white-space: nowrap;
  flex-shrink: 1;
}
.nav-tab:hover { background: var(--input); color: var(--ts); }
.nav-tab.active { background: var(--accent-l); color: var(--accent); font-weight: 500; }

.search-wrap {
  background: var(--input);
  border: 1px solid var(--border-s);
  border-radius: 20px;
  padding: 5px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 120px;
  max-width: 200px;
  flex: 1;
  margin-left: auto;
  flex-shrink: 1;
}
.search-wrap input {
  border: none;
  background: none;
  outline: none;
  font-size: 12px;
  color: var(--tp);
  width: 100%;
  font-family: 'Segoe UI', Arial, sans-serif;
  min-width: 0;
}
.search-wrap input::placeholder { color: var(--th); }

.btn-add {
  background: var(--accent);
  border: none;
  border-radius: var(--r-md);
  color: #fff;
  font-size: 12px;
  padding: 7px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  font-family: 'Segoe UI', Arial, sans-serif;
  font-weight: 500;
  transition: background 0.15s;
  flex-shrink: 0;
}
.btn-add:hover { background: var(--accent-h); }

/* SUBBAR */
.subbar {
  background: var(--white);
  height: 40px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 7px;
  border-bottom: 1px solid var(--border-l);
  flex-shrink: 0;
}

.filter-pill {
  font-size: 11px;
  padding: 4px 13px;
  border-radius: 14px;
  border: 1px solid var(--border-s);
  color: var(--ts);
  cursor: pointer;
  background: var(--white);
  font-family: 'Segoe UI', Arial, sans-serif;
  transition: all 0.15s;
}
.filter-pill:hover { border-color: var(--accent); color: var(--accent); }
.filter-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

.sort-wrap { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.sort-label { font-size: 11px; color: var(--th); }
.sort-btn {
  font-size: 11px;
  color: var(--tm);
  cursor: pointer;
  background: none;
  border: none;
  font-family: 'Segoe UI', Arial, sans-serif;
  padding: 2px 6px;
  border-radius: var(--r-sm);
  transition: all 0.15s;
}
.sort-btn:hover { color: var(--accent); background: var(--accent-l); }
.sort-btn.active { color: var(--accent); font-weight: 600; }
.count-lbl { font-size: 11px; color: var(--th); margin-left: 8px; }

/* PAGE CONTENT */
.page-content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

/* STATUSBAR */
.statusbar {
  background: var(--white);
  height: 30px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 14px;
  border-top: 1px solid var(--border-l);
  flex-shrink: 0;
}
.sb-item {
  font-size: 11px;
  color: var(--ts);
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.sb-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.sb-sep { color: var(--border); font-size: 14px; }
.sb-msg {
  font-size: 11px;
  color: var(--accent);
  margin-left: auto;
  white-space: nowrap;
  font-weight: 500;
}

/* BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 15px;
  border-radius: var(--r-md);
  font-size: 12px;
  font-family: 'Segoe UI', Arial, sans-serif;
  cursor: pointer;
  border: none;
  font-weight: 500;
  transition: all 0.15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-h); }
.btn-secondary { background: var(--input); color: var(--ts); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger { background: #fff5f5; color: var(--error); border: 1px solid #ffd0d0; }
.btn-danger:hover { background: #ffe0e0; }

/* EMPTY STATE */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 40px;
}
.empty-icon { font-size: 64px; }
.empty-title { font-size: 18px; font-weight: 600; color: var(--tm); }
.empty-sub { font-size: 14px; color: var(--th); text-align: center; line-height: 1.6; }

/* PAGE TITLES */
.page-title { font-size: 20px; font-weight: 700; color: var(--tp); margin-bottom: 4px; }
.page-subtitle { font-size: 13px; color: var(--tm); }

/* SECTION CARD */
.sc {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  overflow: hidden;
}
.sc-head {
  padding: 14px 18px 0;
  font-size: 10px;
  font-weight: 700;
  color: var(--th);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.sc-body { padding: 0 18px 18px; }

@keyframes spin {
  from { display: inline-block; transform: rotate(0deg); }
  to   { display: inline-block; transform: rotate(360deg); }
}
#sb-progress-spinner {
  display: inline-block;
  animation: spin 1s linear infinite;
}

{% block extra_styles %}{% endblock %}
</style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="logo">📦 PS4 PKG<span class="accent">Vault</span></div>

    <button id="back-btn" onclick="_callBridge(function(b){ b.go_back(); })">
      ← Retour
    </button>

    <nav class="nav-tabs">
      <button class="nav-tab {% if active_page == 'library' %}active{% endif %}"
              onclick="_callBridge(function(b){ b.navigate('library'); })">
        🗂️ Bibliothèque
      </button>
      <button class="nav-tab {% if active_page == 'folders' %}active{% endif %}"
              onclick="_callBridge(function(b){ b.navigate('folders'); })">
        📁 Dossiers
      </button>
      <button class="nav-tab {% if active_page == 'settings' %}active{% endif %}"
              onclick="_callBridge(function(b){ b.navigate('settings'); })">
        ⚙️ Paramètres
      </button>
      <button class="nav-tab {% if active_page == 'credits' %}active{% endif %}"
              onclick="_callBridge(function(b){ b.navigate('credits'); })">
        ℹ️ À propos
      </button>

      <button class="nav-tab {% if active_page == 'activity' %}active{% endif %}"
              onclick="_callBridge(function(b){ b.navigate('activity'); })">
        📋 Activité
      </button>

    </nav>

    <div class="search-wrap">
      <span style="color:var(--th); font-size:14px;">🔍</span>
      <input type="text" id="search-input"
        placeholder="Rechercher un titre, CUSA…"
        oninput="_callBridge(function(b){ b.search(document.getElementById('search-input').value); })" />
    </div>

    <button id="btn-fetch-api"
            onclick="_callBridge(function(b){ b.fetch_api(); })"
            title="Récupérer les données API RAWG"
            style="
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            color: var(--ts);
            font-size: 12px;
            padding: 6px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            font-family: 'Segoe UI', Arial, sans-serif;
            flex-shrink: 0;
            transition: all 0.15s;"
            onmouseover="this.style.background='var(--accent-l)'; this.style.color='var(--accent)'; this.style.borderColor='var(--accent-b)';"
            onmouseout="this.style.background='var(--input)'; this.style.color='var(--ts)'; this.style.borderColor='var(--border)';">
      🔄 Données API
    </button>

    <button class="btn-add"
      onclick="_callBridge(function(b){ b.add_folder(); })">
      ➕ Ajouter un dossier
    </button>
  </div>

  <!-- SUBBAR -->
  {% if active_page == 'library' %}
<div class="subbar">
  <button class="filter-pill {% if active_filter == 'all' %}active{% endif %}"
    onclick="_callBridge(function(b){ b.set_filter('all'); })">Tous</button>
  <button class="filter-pill {% if active_filter == 'game' %}active{% endif %}"
    onclick="_callBridge(function(b){ b.set_filter('game'); })">BASE</button>
  <button class="filter-pill {% if active_filter == 'dlc' %}active{% endif %}"
    onclick="_callBridge(function(b){ b.set_filter('dlc'); })">DLC</button>
  <button class="filter-pill {% if active_filter == 'update' %}active{% endif %}"
    onclick="_callBridge(function(b){ b.set_filter('update'); })">UPDATE</button>
  <button class="filter-pill {% if active_filter == 'backport' %}active{% endif %}"
    onclick="_callBridge(function(b){ b.set_filter('backport'); })">BACKPORT</button>

  <div class="sort-wrap">
    <span class="sort-label">Trier :</span>
    <button class="sort-btn {% if active_sort == 'title' %}active{% endif %}"
      onclick="_callBridge(function(b){ b.set_sort('title'); })">Nom</button>
    <button class="sort-btn {% if active_sort == 'size' %}active{% endif %}"
      onclick="_callBridge(function(b){ b.set_sort('size'); })">Taille</button>
    <button class="sort-btn {% if active_sort == 'type' %}active{% endif %}"
      onclick="_callBridge(function(b){ b.set_sort('type'); })">Type</button>
  </div>

  <div style="width:1px; height:16px; background:var(--border); margin: 0 4px;"></div>

  <button
    onclick="_callBridge(function(b){ b.toggle_view(); })"
    title="{% if view_mode == 'list' %}Vue grille{% else %}Vue liste{% endif %}"
    style="
      background: {% if view_mode == 'list' %}var(--accent-l){% else %}transparent{% endif %};
      border: 1px solid {% if view_mode == 'list' %}var(--accent-b){% else %}var(--border){% endif %};
      border-radius: var(--r-md);
      color: {% if view_mode == 'list' %}var(--accent){% else %}var(--tm){% endif %};
      width: 30px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
      transition: all 0.15s;
    ">
    {% if view_mode == 'list' %}⊞{% else %}☰{% endif %}
  </button>

  <span class="count-lbl">{{ count_str }}</span>
</div>
{% endif %}

  <!-- PAGE CONTENT -->
  <div class="page-content">
    {% block content %}{% endblock %}
  </div>

  <!-- STATUSBAR -->
  <div class="statusbar">
  <div class="sb-item">
    <span class="sb-dot" style="background:#0067c0;"></span>
    Jeux {{ stats.game }}
  </div>
  <span class="sb-sep">|</span>
  <div class="sb-item">
    <span class="sb-dot" style="background:#107c10;"></span>
    DLC {{ stats.dlc }}
  </div>
  <span class="sb-sep">|</span>
  <div class="sb-item">
    <span class="sb-dot" style="background:#0078d4;"></span>
    Updates {{ stats.updates }}
  </div>
  <span class="sb-sep">|</span>
  <div class="sb-item">
    <span class="sb-dot" style="background:#ca5010;"></span>
    Backports {{ stats.backport }}
  </div>
  <span class="sb-sep">|</span>
  <div class="sb-item">{{ stats.total_size }}</div>
  <div class="sb-msg" id="sb-msg">
    <span id="sb-progress" style="display:none; margin-right:8px;">
      <span id="sb-progress-bar-wrap" style="
        display:inline-flex;
        align-items:center;
        gap:6px;
        background:var(--accent-l);
        border:1px solid var(--accent-b);
        border-radius:10px;
        padding:2px 10px;
        font-size:10px;
        color:var(--accent);
      ">
        <span id="sb-progress-spinner">⟳</span>
        <span id="sb-progress-text">API en cours…</span>
      </span>
    </span>
    {{ status_msg }}
  </div>
</div>

</div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
var pybridge      = null;
var _pendingCalls = [];

function _callBridge(fn) {
  if (pybridge) {
    fn(pybridge);
  } else {
    _pendingCalls.push(fn);
  }
}

new QWebChannel(qt.webChannelTransport, function(channel) {
  pybridge = channel.objects.pybridge;
  _pendingCalls.forEach(function(fn) { fn(pybridge); });
  _pendingCalls = [];
});

function showBackBtn(show) {
  var btn = document.getElementById('back-btn');
  if (btn) btn.style.display = show ? 'inline-flex' : 'none';
}

{% block extra_scripts %}{% endblock %}
</script>
</body>
</html>
